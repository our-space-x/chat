<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY UNIVERSE</title>
<style>
/* ===== THEME: cyan + red neon on black (screenshots jaisa) ===== */
:root{--bg:#000;--panel:#07070f;--cy:#00f0ff;--rd:#ff0040;--tx:#e8fdff;--mut:#6c8a90;--mine:#06303a;--them:#14141f}
body.light{--bg:#f2f8fa;--panel:#fff;--cy:#008a99;--rd:#d0002f;--tx:#0a1a1e;--mut:#5a6b70;--mine:#c9f1f6;--them:#e6ecee}
*{box-sizing:border-box;margin:0;font-family:Arial,Helvetica,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--tx)}
.hide{display:none!important}
input,button,textarea{font-size:15px;color:var(--tx);background:transparent;outline:none}
.box{border:2px solid var(--cy);background:var(--panel);padding:34px;width:min(92vw,380px);box-shadow:0 0 18px var(--cy)}
.box.red{border-color:var(--rd);box-shadow:0 0 18px var(--rd)}
h1{color:var(--cy);letter-spacing:4px;text-shadow:0 0 12px var(--cy);text-align:center;font-weight:400}
.full{width:100%;padding:14px;margin-top:14px;border:1px solid var(--cy);text-align:center;letter-spacing:3px}
.btn{width:100%;padding:13px;margin-top:14px;border:1px solid var(--cy);color:var(--cy);font-weight:700;cursor:pointer}
.btn.red{border-color:var(--rd);color:var(--rd)}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.err{color:var(--rd);font-size:13px;margin-top:10px;text-align:center;min-height:16px}
/* ===== APP LAYOUT ===== */
#app{display:flex;height:100%}
#side{width:340px;border-right:1px solid var(--cy);display:flex;flex-direction:column;background:var(--panel)}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex}.tabs button{flex:1;padding:14px;border-bottom:2px solid transparent;color:var(--mut);cursor:pointer;letter-spacing:2px}
.tabs button.on{color:var(--cy);border-color:var(--cy)}
#list{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #1a2a2e;cursor:pointer}
.row:hover{background:#0a1a1e55}
.av{width:42px;height:42px;border-radius:50%;border:1px solid var(--cy);display:flex;align-items:center;justify-content:center;color:var(--cy);flex:none;background-size:cover;background-position:center;position:relative}
.dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#2aff7a;border:2px solid var(--panel)}
.grow{flex:1;min-width:0}.sub{color:var(--mut);font-size:12px}
.sm{padding:6px 12px;border:1px solid var(--rd);color:var(--rd);cursor:pointer;font-size:12px}
.sm.on{border-color:var(--cy);color:var(--cy)}
#head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--cy);background:var(--panel)}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background-size:cover}
.m{max-width:78%;padding:8px 11px;border-radius:10px;background:var(--them);word-wrap:break-word;white-space:pre-wrap;cursor:pointer}
.m.me{align-self:flex-end;background:var(--mine);border:1px solid #00f0ff44}
.m img{max-width:100%;max-height:260px;border-radius:6px;display:block;margin-bottom:4px}
.q{border-left:3px solid var(--rd);padding:2px 8px;margin-bottom:4px;font-size:12px;color:var(--mut)}
.meta{font-size:10px;color:var(--mut);text-align:right;margin-top:3px}.read{color:var(--cy)}
.rx{font-size:13px;margin-top:2px}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--cy);background:var(--panel);align-items:center}
#bar textarea{flex:1;border:1px solid #1d3a40;padding:10px;resize:none;height:42px}
.ic{cursor:pointer;font-size:22px;color:var(--cy);padding:4px 8px}
#reply{display:none;padding:6px 14px;border-top:1px solid var(--rd);font-size:12px;color:var(--mut)}
#menu{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
#menu div.card{background:var(--panel);border:1px solid var(--cy);padding:12px;min-width:230px}
#menu button{display:block;width:100%;padding:11px;text-align:left;cursor:pointer}
.empty{margin:auto;color:var(--mut);text-align:center;padding:20px}
@media(max-width:700px){#side{width:100%}#chat{display:none}#app.inchat #side{display:none}#app.inchat #chat{display:flex}.back{display:inline!important}}
.back{display:none;cursor:pointer;color:var(--cy);font-size:22px}
</style>
</head>
<body>

<!-- STEP 1: PASSCODE GATE -->
<div id="gate" class="center">
  <h1>DECRYPT GATEWAY // ENTER ACCESS CREDENTIALS</h1>
  <div class="box red">
    <input id="pc" class="full" style="margin:0" type="password" placeholder="PASSCODE">
    <button class="btn red" onclick="openGate()">OPEN MATRIX INTERFACE</button>
    <div class="err" id="pcerr"></div>
  </div>
</div>

<!-- STEP 2: USERNAME + PASSWORD (no email / phone) -->
<div id="auth" class="center hide">
  <div class="box">
    <h1 style="font-size:24px;margin-bottom:20px">INITIALIZE NODE TRANSIT</h1>
    <input id="u" class="full" style="margin:0 0 12px" placeholder="username" autocomplete="username">
    <input id="p" class="full" style="margin:0" type="password" placeholder="password" autocomplete="current-password">
    <button class="btn" onclick="auth(true)">GENERATE NEW IDENTITY</button>
    <button class="btn red" onclick="auth(false)">SYNC EXISTING NODE</button>
    <div class="err" id="aerr"></div>
  </div>
</div>

<!-- STEP 3: MAIN APP -->
<div id="app" class="hide">
  <div id="side">
    <div class="tabs"><button id="t0" onclick="tab(0)">CHATS</button><button id="t1" onclick="tab(1)">FIND</button><button id="t2" onclick="tab(2)">ME</button></div>
    <div id="find" class="hide" style="padding:10px"><input id="q" class="full" style="margin:0" placeholder="search username" oninput="debounceFind()"></div>
    <div id="list"></div>
  </div>
  <div id="chat"><div class="empty">Select a chat or find a user to start talking.</div></div>
</div>

<input type="file" id="file" class="hide" accept="image/*,.pdf,.zip,.docx" onchange="sendFile(this)">
<input type="file" id="dpfile" class="hide" accept="image/*" onchange="setDP(this)">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIG: apna Supabase URL aur anon (public) key yahan paste karo
   (Supabase > Project Settings > API). service_role key KABHI mat daalna.
   ============================================================ */
const SUPABASE_URL = 'https://sqitlhjrsowwivldisgg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mxlZD4koFZGH31QGM14V_Q_YxFuzAZX';
/* Passcode " " ka SHA-256 hash (asli passcode code me nahi likha hai) */
const PASS_HASH = 'e771cd06c19dc6a46e1bb7f1a5491cd6f53c5622475053eb103174fd55b37b46';

const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let sb, me, myPriv, cur = null, msgs = {}, peers = {}, follows = new Set(), replyTo = null, curTab = 0, typingCh, typingTimer;

/* ---------- PASSCODE GATE ---------- */
async function sha(t){ return [...new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(t)))].map(x => x.toString(16).padStart(2,'0')).join(''); }
async function openGate(){
  if (await sha($('pc').value) === PASS_HASH){ sessionStorage.gate = '1'; start(); }
  else $('pcerr').textContent = 'ACCESS DENIED';
}
$('pc').addEventListener('keydown', e => e.key === 'Enter' && openGate());
if (sessionStorage.gate) start();

/* Gate ke baad hi Supabase connect hota hai */
async function start(){
  $('gate').classList.add('hide');
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.auth.getSession();
  if (data.session && localStorage.mu_priv) boot(); else { await sb.auth.signOut(); $('auth').classList.remove('hide'); }
}

/* ---------- E2EE (ECDH P-256 + AES-GCM) ----------
   Har user ka key pair banta hai. Private key password se lock hoke 'keys' table me jaati hai,
   isliye naye device par login karke bhi purane messages khul jaate hain. */
async function pwKey(u, p){
  const m = await crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt: enc.encode('mu:' + u), iterations:150000, hash:'SHA-256' }, m, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function wrap(jwk, u, p){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await pwKey(u, p), enc.encode(JSON.stringify(jwk)));
  return b64(iv) + '.' + b64(c);
}
async function unwrap(s, u, p){
  const [i, c] = s.split('.');
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(i) }, await pwKey(u, p), unb64(c))));
}
const skeys = {};
async function shared(peer){
  if (skeys[peer.id]) return skeys[peer.id];
  const pub = await crypto.subtle.importKey('jwk', peer.pubkey, { name:'ECDH', namedCurve:'P-256' }, false, []);
  return skeys[peer.id] = await crypto.subtle.deriveKey({ name:'ECDH', public: pub }, myPriv, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function enT(peer, t){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return b64(iv) + '.' + b64(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await shared(peer), enc.encode(t)));
}
async function deT(peer, s){
  try { const [i, c] = s.split('.'); return dec.decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(i) }, await shared(peer), unb64(c))); }
  catch { return '🔒 could not decrypt'; }
}

/* ---------- SIGN UP / LOGIN (sirf username + password) ----------
   Supabase Auth ko email chahiye, isliye username se ek nakli email banta hai (user ko dikhta nahi). */
const err = t => $('aerr').textContent = t;
async function auth(isNew){
  const u = $('u').value.trim().toLowerCase(), p = $('p').value;
  if (!/^[a-z0-9_]{3,20}$/.test(u)) return err('Username: 3-20 letters, numbers or _');
  if (!p) return err('Enter a password');
  const email = u + '@myuniverse.app', pw = p + '_uni77'; // suffix se chhota password bhi chalega
  err('Working...');
  if (isNew){
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    if (error) return err(/registered/i.test(error.message) ? 'Username already taken' : error.message);
    if (!data.session) return err('Supabase me "Confirm email" OFF karo, phir dobara try karo');
    const kp = await crypto.subtle.generateKey({ name:'ECDH', namedCurve:'P-256' }, true, ['deriveKey']);
    const pub = await crypto.subtle.exportKey('jwk', kp.publicKey), priv = await crypto.subtle.exportKey('jwk', kp.privateKey);
    const id = data.user.id;
    const r = await sb.from('profiles').insert({ id, username: u, pubkey: pub });
    if (r.error) return err('Profile error: ' + r.error.message);
    await sb.from('keys').insert({ id, enc_priv: await wrap(priv, u, p) });
    localStorage.mu_priv = JSON.stringify(priv);
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) return err('Wrong username or password');
    const k = await sb.from('keys').select('enc_priv').eq('id', data.user.id).single();
    try { localStorage.mu_priv = JSON.stringify(await unwrap(k.data.enc_priv, u, p)); }
    catch { return err('Could not unlock your keys'); }
  }
  boot();
}
$('p').addEventListener('keydown', e => e.key === 'Enter' && auth(false));

/* ---------- BOOT: login ke baad ---------- */
async function boot(){
  const { data } = await sb.auth.getUser();
  const r = await sb.from('profiles').select('*').eq('id', data.user.id).single();
  me = r.data; peers[me.id] = me;
  myPriv = await crypto.subtle.importKey('jwk', JSON.parse(localStorage.mu_priv), { name:'ECDH', namedCurve:'P-256' }, false, ['deriveKey']);
  $('auth').classList.add('hide'); $('app').classList.remove('hide');
  if (localStorage.mu_theme === 'light') document.body.classList.add('light');
  await loadFollows(); tab(0);
  // Realtime: naye messages, ticks, online status
  sb.channel('db')
    .on('postgres_changes', { event:'*', schema:'public', table:'messages' }, onMsg)
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'profiles' }, p => { peers[p.new.id] = { ...peers[p.new.id], ...p.new }; if (cur && cur.id === p.new.id) header(); if (curTab === 0) renderChats(); })
    .subscribe();
  beat(); setInterval(beat, 25000);
}
const beat = () => sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', me.id); // online/last seen
const online = p => p && Date.now() - new Date(p.last_seen) < 60000;
const lastSeen = p => online(p) ? 'online' : 'last seen ' + new Date(p.last_seen).toLocaleString([], { hour:'2-digit', minute:'2-digit', day:'numeric', month:'short' });
async function loadFollows(){ const r = await sb.from('follows').select('following').eq('follower', me.id); follows = new Set((r.data || []).map(x => x.following)); }
async function getPeer(id){
  if (!peers[id]) peers[id] = (await sb.from('profiles').select('id,username,about,avatar_url,pubkey,last_seen').eq('id', id).single()).data;
  return peers[id];
}

/* ---------- SIDEBAR TABS ---------- */
function tab(n){
  curTab = n;
  [0,1,2].forEach(i => $('t' + i).classList.toggle('on', i === n));
  $('find').classList.toggle('hide', n !== 1);
  if (n === 0) renderChats(); else if (n === 1) { $('list').innerHTML = '<div class="empty">Type a username to search.</div>'; } else renderMe();
}
function avatar(p, dot){
  const a = document.createElement('div'); a.className = 'av';
  if (p.avatar_url) a.style.backgroundImage = `url(${p.avatar_url})`; else a.textContent = p.username[0].toUpperCase();
  if (dot && online(p)) { const d = document.createElement('div'); d.className = 'dot'; a.appendChild(d); }
  return a;
}
function userRow(p, extra){
  const r = document.createElement('div'); r.className = 'row';
  const g = document.createElement('div'); g.className = 'grow';
  g.innerHTML = '<div></div><div class="sub"></div>'; g.children[0].textContent = p.username; g.children[1].textContent = extra || p.about || '';
  r.append(avatar(p, true), g); r.onclick = () => openChat(p.id); return r;
}
async function renderChats(){
  const r = await sb.from('messages').select('sender,receiver').or(`sender.eq.${me.id},receiver.eq.${me.id}`).order('created_at', { ascending:false }).limit(300);
  const ids = new Set(follows); (r.data || []).forEach(m => ids.add(m.sender === me.id ? m.receiver : m.sender));
  const L = $('list'); L.innerHTML = '';
  if (!ids.size) L.innerHTML = '<div class="empty">No chats yet. Use FIND to follow someone.</div>';
  for (const id of ids) { const p = await getPeer(id); if (p) L.appendChild(userRow(p, lastSeen(p))); }
}
let ft; function debounceFind(){ clearTimeout(ft); ft = setTimeout(find, 300); }
async function find(){
  const q = $('q').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, ''); const L = $('list'); L.innerHTML = '';
  if (!q) return;
  const r = await sb.from('profiles').select('id,username,about,avatar_url,pubkey,last_seen').ilike('username', q + '%').neq('id', me.id).limit(20);
  if (!r.data.length) L.innerHTML = '<div class="empty">No user found.</div>';
  r.data.forEach(p => {
    peers[p.id] = p; const row = userRow(p); const b = document.createElement('button'); b.className = 'sm' + (follows.has(p.id) ? ' on' : '');
    b.textContent = follows.has(p.id) ? 'FOLLOWING' : 'FOLLOW';
    b.onclick = async e => { e.stopPropagation();
      if (follows.has(p.id)) { await sb.from('follows').delete().eq('follower', me.id).eq('following', p.id); follows.delete(p.id); }
      else { await sb.from('follows').insert({ follower: me.id, following: p.id }); follows.add(p.id); }
      b.className = 'sm' + (follows.has(p.id) ? ' on' : ''); b.textContent = follows.has(p.id) ? 'FOLLOWING' : 'FOLLOW'; };
    row.appendChild(b); L.appendChild(row);
  });
}

/* ---------- PROFILE (DP, about, theme, logout) ---------- */
function renderMe(){
  const L = $('list'); L.innerHTML = '';
  const w = document.createElement('div'); w.style.padding = '18px';
  w.innerHTML = `<div style="display:flex;gap:14px;align-items:center;margin-bottom:16px"><div id="mydp"></div><div><b>${me.username}</b><div class="sub">tap photo to change</div></div></div>
  <input id="about" class="full" style="margin:0" maxlength="80" placeholder="About">
  <button class="btn" onclick="saveAbout()">SAVE ABOUT</button>
  <button class="btn" onclick="toggleTheme()">DARK / LIGHT MODE</button>
  <button class="btn red" onclick="logout()">LOG OUT</button>`;
  L.appendChild(w); $('about').value = me.about || '';
  const a = avatar(me); a.style.cursor = 'pointer'; a.onclick = () => $('dpfile').click(); $('mydp').appendChild(a);
}
async function saveAbout(){ me.about = $('about').value; await sb.from('profiles').update({ about: me.about }).eq('id', me.id); }
async function setDP(i){
  const f = i.files[0]; if (!f) return; const path = `dp/${me.id}_${Date.now()}`;
  await sb.storage.from('media').upload(path, f); me.avatar_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
  await sb.from('profiles').update({ avatar_url: me.avatar_url }).eq('id', me.id); renderMe();
}
function toggleTheme(){ document.body.classList.toggle('light'); localStorage.mu_theme = document.body.classList.contains('light') ? 'light' : 'dark'; }
async function logout(){ await sb.auth.signOut(); localStorage.removeItem('mu_priv'); sessionStorage.clear(); location.reload(); }

/* ---------- CHAT WINDOW ---------- */
async function openChat(id){
  cur = await getPeer(id); msgs = {}; replyTo = null; $('app').classList.add('inchat');
  $('chat').innerHTML = `<div id="head"><span class="back" onclick="closeChat()">←</span><div id="hav"></div><div class="grow"><div id="hn"></div><div class="sub" id="hs"></div></div></div>
  <div id="msgs"></div><div id="reply"></div>
  <div id="bar"><span class="ic" onclick="$('file').click()">📎</span><textarea id="inp" placeholder="Message"></textarea><span class="ic" onclick="send()">➤</span></div>`;
  header();
  $('inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('inp').addEventListener('input', () => typingCh && typingCh.send({ type:'broadcast', event:'t', payload:{ from: me.id } }));
  // Typing indicator ke liye dono users ka common channel
  const key = [me.id, cur.id].sort().join('');
  if (typingCh) sb.removeChannel(typingCh);
  typingCh = sb.channel('typing-' + key).on('broadcast', { event:'t' }, ({ payload }) => {
    if (payload.from !== cur.id) return; $('hs').textContent = 'typing...'; clearTimeout(typingTimer); typingTimer = setTimeout(header, 1800); }).subscribe();
  const r = await sb.from('messages').select('*').or(`and(sender.eq.${me.id},receiver.eq.${cur.id}),and(sender.eq.${cur.id},receiver.eq.${me.id})`).order('created_at', { ascending:false }).limit(100);
  for (const m of r.data.reverse()) { m._t = m.body ? await deT(cur, m.body) : ''; msgs[m.id] = m; }
  markRead(); paint();
}
function closeChat(){ $('app').classList.remove('inchat'); cur = null; if (typingCh) sb.removeChannel(typingCh), typingCh = null; }
function header(){ if (!cur) return; $('hav').replaceChildren(avatar(cur, true)); $('hn').textContent = cur.username; $('hs').textContent = lastSeen(cur); }
function markRead(){ // blue tick
  if (cur) sb.from('messages').update({ status:'read' }).eq('sender', cur.id).eq('receiver', me.id).neq('status', 'read').then(() => {});
}
function paint(){
  const box = $('msgs'); if (!box) return; box.innerHTML = '';
  const list = Object.values(msgs).filter(m => !(m.deleted_for || []).includes(me.id)).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  if (!list.length) box.innerHTML = '<div class="empty">Say hi 👋 Messages are end-to-end encrypted.</div>';
  list.forEach(m => {
    const mine = m.sender === me.id, d = document.createElement('div'); d.className = 'm' + (mine ? ' me' : '');
    if (m.deleted_all) d.textContent = '🚫 This message was deleted';
    else {
      const rp = m.reply_to && msgs[m.reply_to];
      if (rp) { const q = document.createElement('div'); q.className = 'q'; q.textContent = rp.deleted_all ? 'deleted message' : (rp._t || '📎 media'); d.appendChild(q); }
      if (m.media_url) {
        if (/\.(png|jpe?g|gif|webp)/i.test(m.media_url)) { const i = document.createElement('img'); i.src = m.media_url; d.appendChild(i); }
        else { const a = document.createElement('a'); a.href = m.media_url; a.target = '_blank'; a.textContent = '📄 Open file'; a.style.color = 'var(--cy)'; d.appendChild(a); }
      }
      if (m._t) d.appendChild(document.createTextNode(m._t));
      const rx = Object.values(m.reactions || {}); if (rx.length) { const x = document.createElement('div'); x.className = 'rx'; x.textContent = rx.join(' '); d.appendChild(x); }
    }
    const t = document.createElement('div'); t.className = 'meta';
    const tick = !mine ? '' : m.status === 'read' ? ' <span class="read">✓✓</span>' : m.status === 'delivered' ? ' ✓✓' : ' ✓';
    t.innerHTML = new Date(m.created_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) + tick; d.appendChild(t);
    if (!m.deleted_all) d.onclick = () => menu(m);
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;
}
async function send(media){
  const t = $('inp').value.trim(); if (!t && !media) return;
  $('inp').value = '';
  const row = { sender: me.id, receiver: cur.id, body: t ? await enT(cur, t) : null, media_url: media || null, reply_to: replyTo };
  clearReply(); const r = await sb.from('messages').insert(row).select().single();
  if (r.data) { r.data._t = t; msgs[r.data.id] = r.data; paint(); }
}
async function sendFile(i){
  const f = i.files[0]; if (!f || !cur) return; const path = `chat/${me.id}/${Date.now()}_${f.name.replace(/[^\w.]/g, '_')}`;
  const up = await sb.storage.from('media').upload(path, f); i.value = '';
  if (up.error) return alert('Upload failed: ' + up.error.message);
  send(sb.storage.from('media').getPublicUrl(path).data.publicUrl);
}
/* Realtime handler: naya message / tick change */
async function onMsg(p){
  const m = p.new; if (!m || !m.id) return;
  if (m.receiver === me.id && p.eventType === 'INSERT') sb.from('messages').update({ status: cur && cur.id === m.sender ? 'read' : 'delivered' }).eq('id', m.id).then(() => {}); // double tick
  if (cur && (m.sender === cur.id || m.receiver === cur.id)) {
    const peer = await getPeer(m.sender === me.id ? m.receiver : m.sender); m._t = m.body ? await deT(peer, m.body) : ''; msgs[m.id] = m; paint();
  }
  if (curTab === 0) renderChats();
  if (m.sender !== me.id && document.hidden && Notification.permission === 'granted') new Notification('New message'); // browser notification (tab open ho tab)
}
/* Message menu: reply, react, delete */
function menu(m){
  const mine = m.sender === me.id, o = document.createElement('div'); o.id = 'menu'; o.onclick = e => e.target === o && o.remove();
  const c = document.createElement('div'); c.className = 'card';
  const add = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = () => { o.remove(); fn(); }; c.appendChild(b); };
  const em = document.createElement('div'); em.style.cssText = 'display:flex;justify-content:space-around;font-size:24px;padding:6px 0';
  ['👍','❤️','😂','😮','😢'].forEach(e => { const s = document.createElement('span'); s.textContent = e; s.style.cursor = 'pointer'; s.onclick = () => { o.remove(); react(m, e); }; em.appendChild(s); });
  c.appendChild(em);
  add('Reply', () => { replyTo = m.id; $('reply').style.display = 'block'; $('reply').textContent = '↩ ' + (m._t || 'media') + '   (tap to cancel)'; $('reply').onclick = clearReply; $('inp').focus(); });
  add('Delete for me', async () => { const a = [...(m.deleted_for || []), me.id]; await sb.from('messages').update({ deleted_for: a }).eq('id', m.id); m.deleted_for = a; paint(); });
  if (mine) add('Delete for everyone', async () => { await sb.from('messages').update({ deleted_all: true, body: null, media_url: null }).eq('id', m.id); m.deleted_all = true; m._t = ''; m.media_url = null; paint(); });
  o.appendChild(c); document.body.appendChild(o);
}
function clearReply(){ replyTo = null; const r = $('reply'); if (r) r.style.display = 'none'; }
async function react(m, e){
  const rx = { ...(m.reactions || {}) }; if (rx[me.id] === e) delete rx[me.id]; else rx[me.id] = e;
  await sb.from('messages').update({ reactions: rx }).eq('id', m.id); m.reactions = rx; paint();
}
if ('Notification' in window && Notification.permission === 'default') document.addEventListener('click', () => Notification.requestPermission(), { once:true });
</script>
